<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dashboard Monitoring & Controlling — Support Back TLC</title>
<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700;900&family=Roboto+Mono:wght@400;500;600&display=swap" rel="stylesheet"/>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --blue:#1a73e8;--blue-dark:#0b57d0;--blue-tint:#e8f0fe;--gold:#f9ab00;
  --surface:#f4f6fb;--card:#fff;--text:#202124;--muted:#5f6368;--border:#e1e4ea;
  --shadow:0 1px 2px 0 rgba(60,64,67,.30),0 1px 3px 1px rgba(60,64,67,.12);
  --shadow-hover:0 1px 3px 0 rgba(60,64,67,.30),0 6px 14px 2px rgba(60,64,67,.14);
  --radius-lg:20px;--radius-md:16px;--radius-sm:12px;
}
html{scroll-behavior:smooth}
body{font-family:'Roboto',Arial,sans-serif;background:var(--surface);color:var(--text);min-height:100vh;display:flex;flex-direction:column}

/* HEADER */
header{
  background:#fff;color:var(--text);padding:14px 24px;
  position:sticky;top:0;z-index:200;
  border-bottom:1px solid var(--border);
  box-shadow:0 1px 2px rgba(60,64,67,.08);
}
.h-inner{max-width:1120px;margin:0 auto;display:flex;align-items:center;gap:14px}
.h-logo{width:44px;height:44px;border-radius:14px;background:linear-gradient(135deg,#4285F4 0%,#1a73e8 55%,#0b57d0 100%);display:flex;align-items:center;justify-content:center;flex-shrink:0;box-shadow:0 2px 8px rgba(26,115,232,.35)}
.h-logo svg{width:24px;height:24px}
header h1{font-size:18px;font-weight:700;letter-spacing:-.01em;color:var(--text);line-height:1.25}
.h-sub{font-size:12.5px;color:var(--muted);line-height:1.4;margin-top:1px}

header.hidden{display:none}

/* BACK BAR */
#back-bar{display:none;background:var(--blue-tint);color:var(--blue);padding:10px 20px;align-items:center;gap:8px;cursor:pointer;font-size:13.5px;font-weight:600;user-select:none;position:sticky;top:0;z-index:199;border-bottom:1px solid #d2e3fc}
#back-bar.visible{display:flex}
#back-bar svg{width:18px;height:18px;stroke:var(--blue);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
#back-bar span{font-weight:700}

.welcome-desc{font-size:14.5px;line-height:1.6;color:rgba(255,255,255,.92);max-width:460px;text-shadow:0 1px 4px rgba(0,0,0,.4)}
@media(max-width:700px){
  .welcome-banner{padding:28px 24px;border-radius:16px}
  .welcome-art{display:none}
  .welcome-title{font-size:22px}
}

/* CAROUSEL */
.carousel-wrap{
  max-width:1120px;width:calc(100% - 32px);margin:14px auto 0;overflow:hidden;position:relative;
  -webkit-mask-image:linear-gradient(to right, transparent 0, #000 32px, #000 calc(100% - 32px), transparent 100%);
  mask-image:linear-gradient(to right, transparent 0, #000 32px, #000 calc(100% - 32px), transparent 100%);
}
.carousel-track{display:flex;gap:10px;width:max-content;animation:marquee 40s linear infinite}
.carousel-wrap:hover .carousel-track{animation-play-state:paused}
@keyframes marquee{from{transform:translateX(0)}to{transform:translateX(-50%)}}
.carousel-item{display:flex;align-items:center;gap:9px;background:#fff;border:1px solid var(--border);border-radius:var(--radius-sm);padding:8px 16px 8px 8px;box-shadow:var(--shadow);cursor:pointer;white-space:nowrap;flex-shrink:0;transition:box-shadow .16s,transform .16s}
.carousel-item:hover{box-shadow:var(--shadow-hover);transform:translateY(-2px)}
.carousel-icon{width:26px;height:26px;border-radius:8px;background:var(--c-bg,rgba(26,115,232,.10));display:flex;align-items:center;justify-content:center;flex-shrink:0}
.carousel-icon svg{width:13px;height:13px;stroke:var(--c-accent,var(--blue));fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.carousel-item span{font-size:12px;font-weight:600;color:var(--text)}
@media(max-width:480px){
  .carousel-item{padding:5px 12px 5px 5px;gap:6px}
  .carousel-icon{width:21px;height:21px}
  .carousel-icon svg{width:12px;height:12px}
  .carousel-item span{font-size:11px}
}
@media(prefers-reduced-motion:reduce){
  .carousel-track{animation:none}
}

/* MAIN */
main{flex:1;max-width:1120px;width:100%;margin:0 auto;padding:28px 16px 40px}
.sec-header{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:18px}
.sec-label{font-size:16px;font-weight:700;color:var(--text);display:flex;align-items:center;gap:10px}
.sec-label::before{content:'';width:4px;height:18px;background:var(--blue);border-radius:2px;flex-shrink:0}

.btn-sesuaikan{display:inline-flex;align-items:center;gap:8px;background:#fff;border:1px solid var(--border);color:var(--blue);font-size:13px;font-weight:600;padding:9px 16px;border-radius:10px;cursor:pointer;box-shadow:var(--shadow);transition:box-shadow .18s,background .18s}
.btn-sesuaikan:hover{background:#f8faff;box-shadow:var(--shadow-hover)}
.btn-sesuaikan.active{background:var(--blue-tint);border-color:#d2e3fc}
.btn-sesuaikan .btn-icon{display:flex;align-items:center}
.btn-sesuaikan svg{width:16px;height:16px;stroke:var(--blue);fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}

.grid{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.grid.list-view{display:flex;flex-direction:column;gap:10px}

/* CARD */
.card{background:var(--card);border-radius:var(--radius-md);box-shadow:var(--shadow);padding:20px 18px 18px;display:flex;flex-direction:column;transition:transform .18s,box-shadow .18s;border:1px solid var(--border);cursor:pointer;text-decoration:none;color:inherit;position:relative;overflow:hidden}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover)}
.card-icon-wrap{display:flex;flex-direction:column;gap:10px;margin-bottom:12px}
.card-num{font-family:'Roboto Mono',monospace;font-size:11px;font-weight:600;color:var(--c-accent,var(--blue));letter-spacing:.06em;opacity:.8}
.card-icon{width:42px;height:42px;border-radius:12px;background:var(--c-bg,rgba(26,115,232,.10));display:flex;align-items:center;justify-content:center;flex-shrink:0}
.card-icon svg{width:21px;height:21px;fill:none;stroke:var(--c-accent,var(--blue));stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.card-body{flex:1;margin-bottom:14px}
.card-title{font-size:14px;font-weight:700;color:var(--text);margin-bottom:6px;line-height:1.3}
.card-desc{font-size:12px;color:var(--muted);line-height:1.55}
.card-cta{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;color:var(--c-accent,var(--blue));border:1.5px solid var(--c-accent,var(--blue));border-radius:8px;padding:6px 13px;transition:background .16s,color .16s;align-self:flex-start;flex-shrink:0}
.card:hover .card-cta{background:var(--c-accent,var(--blue));color:#fff}
.card-cta svg{width:13px;height:13px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;transition:transform .16s}
.card:hover .card-cta svg{transform:translateX(3px)}

/* LIST VIEW */
.list-view .card{flex-direction:row;align-items:center;padding:14px 20px;gap:18px}
.list-view .card-icon-wrap{flex-direction:row;align-items:center;gap:12px;margin-bottom:0;flex-shrink:0}
.list-view .card-num{order:2;font-size:10px;background:var(--c-bg,rgba(26,115,232,.10));padding:2px 7px;border-radius:6px}
.list-view .card-icon{order:1}
.list-view .card-body{margin-bottom:0;min-width:0}
.list-view .card-title{margin-bottom:2px}
.list-view .card-desc{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* COLOR VARIANTS */
.c1{--c-accent:#1a73e8;--c-bg:rgba(26,115,232,.09)}
.c2{--c-accent:#188038;--c-bg:rgba(24,128,56,.09)}
.c3{--c-accent:#9334e6;--c-bg:rgba(147,52,230,.09)}
.c4{--c-accent:#e8710a;--c-bg:rgba(232,113,10,.10)}
.c5{--c-accent:#00acc1;--c-bg:rgba(0,172,193,.10)}
.c6{--c-accent:#d01884;--c-bg:rgba(208,24,132,.09)}
.c7{--c-accent:#f9ab00;--c-bg:rgba(249,171,0,.12)}
.c8{--c-accent:#3f51b5;--c-bg:rgba(63,81,181,.09)}
.c9{--c-accent:#0d652d;--c-bg:rgba(13,101,45,.09)}
.c10{--c-accent:#d93025;--c-bg:rgba(217,48,37,.09)}
.c11{--c-accent:#00695c;--c-bg:rgba(0,105,92,.09)}
.c12{--c-accent:#6d4c41;--c-bg:rgba(109,76,65,.09)}
.c13{--c-accent:#d84315;--c-bg:rgba(216,67,21,.10)}
.c14{--c-accent:#8430ce;--c-bg:rgba(132,48,206,.09)}
  .c15{--c-accent:#2f5cde;--c-bg:rgba(47,92,222,.10)}
  .c16{--c-accent:#0d2a52;--c-bg:rgba(13,42,82,.10)}

/* IFRAME VIEW */
#frame-view{display:none;flex:1;flex-direction:column}
#frame-view.active{display:flex}
#frame-wrap{flex:1;position:relative}
#frame-wrap iframe{position:absolute;inset:0;width:100%;height:100%;border:none}
#landing{display:flex;flex:1;flex-direction:column}
#landing.hidden{display:none}

/* FOOTER */
footer{background:#fff;color:var(--muted);text-align:center;padding:16px 24px;font-size:12px;letter-spacing:.02em;flex-shrink:0;border-top:1px solid var(--border)}
footer strong{color:var(--blue);font-weight:700}

/* RESPONSIVE */
@media(max-width:900px){.grid:not(.list-view){grid-template-columns:repeat(2,1fr)}}
@media(max-width:480px){
  header{padding:12px 14px}
  header h1{font-size:15px}
  .h-sub{font-size:11px}
  main{padding:20px 10px 28px}
  .grid:not(.list-view){grid-template-columns:repeat(2,1fr);gap:10px}
  .card{padding:14px 12px 12px}
  .list-view .card{padding:12px 14px}
  .card-icon{width:34px;height:34px}
  .card-icon svg{width:16px;height:16px}
  .card-title{font-size:12.5px}
  .card-desc{font-size:11px}
  .card-cta{font-size:11px;padding:5px 11px}
  .list-view .card-desc{display:none}
  .btn-sesuaikan span.btn-label{display:none}
}
@media(prefers-reduced-motion:reduce){
  .card,.card-cta,.card-cta svg{transition:none}
}

<script>
const APPS = [
  { num:"01", title:"Rekonsil Out", desc:"Cek dan validasi dokumen pengiriman dan amsen customer (Outbound).", cls:"c1", file:"01_Rekonsil_Out.html" },
  { num:"02", title:"Rekonsil In", desc:"Cek dan verifikasi dokumen barang masuk Transfer/Normal (Inbound).", cls:"c2", file:"02_Rekonsil_In.html" },
  { num:"03", title:"Monitoring Pengiriman", desc:"Cek outstanding pengiriman dan total manifest terkirim per hari.", cls:"c3", file:"03_Monitoring_Pengiriman.html" },
  { num:"04", title:"DSL", desc:"Cek dan analisa DSL serta laporan performa layanan pengiriman berdasarkan SLA.", cls:"c4", file:"04_DSL.html" },
  { num:"05", title:"Analisa Delivery Charge", desc:"Analisa biaya pengiriman secara detail untuk efisiensi operasional.", cls:"c5", file:"05_Analisa_Delivery_Charge.html" },
  { num:"06", title:"Calculator Ongkos Kirim", desc:"Hitung estimasi ongkos kirim dengan cepat, mudah, dan akurat.", cls:"c6", file:"06_Calculator_Ongkos_Kirim.html" },
  { num:"07", title:"Akurasi", desc:"Cek dan analisa data akurasi WMS vs NAV untuk rekonsiliasi stok.", cls:"c7", file:"07_Akurasi.html" },
  { num:"08", title:"Monitoring TR In/Out", desc:"Cek plan container in dan outstanding Transfer Out / Transfer In.", cls:"c8", file:"08_Monitoring_TR_InOut.html" },
  { num:"09", title:"Monitoring Omset", desc:"Cek dan Analisa Omset vs Realisasi, Growth & Salper.", cls:"c9", file:"09_Monitoring_Omset.html" },
  { num:"10", title:"Analisa Stock", desc:"Cek dan Analisa Kondisi Stockout dan Stock Class A", cls:"c10", file:"10_Analisa_Stock.html" },
  { num:"11", title:"Mapping & Ritase Kendaraan", desc:"Mapping dan ritase kendaraan agar efektif dan efisien", cls:"c11", file:"11_Mapping_and_Ritase_Kendaraan.html" },
  { num:"12", title:"Schedule Support Back", desc:"Informasi terkait schedule dan tugas support back.", cls:"c12", file:"12_Schedule_Support_Back.html" },
  { num:"13", title:"Picking Offline", desc:"Bantu proses picking barang secara manual. Gunakan hanya saat WMS down atau jaringan toko bermasalah.", cls:"c13", file:"13_Picking_Offline.html" },
  { num:"14", title:"Failed to Delivery Cek", desc:"Cek Barang Pengiriman yang balik dan belum Success Delivery", cls:"c14", file:"14_Failed_to_Delivery_Cek.html" },
  { num:"15", title:"Konfirmasi Pengiriman Customer Service", desc:"Cek dan konfirmasi stock sebelum dikirim.", cls:"c15", file:"15_Konfirmasi_Pengiriman_Customer_Service.html" },
  { num:"16", title:"Rekap Omset Region 6", desc:"Laporan rekap omset regional 6", cls:"c16", file:"16_Rekap_Omset_Region_6.html" },
];

const icons = [
  '<svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="9" y1="13" x2="15" y2="13"/><line x1="9" y1="17" x2="13" y2="17"/></svg>',
  '<svg viewBox="0 0 24 24"><path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/></svg>',
  '<svg viewBox="0 0 24 24"><rect x="1" y="3" width="15" height="13" rx="2"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>',
  '<svg viewBox="0 0 24 24"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/><polyline points="9 12 11 14 15 10"/></svg>',
  '<svg viewBox="0 0 24 24"><line x1="12" y1="1" x2="12" y2="23"/><path d="M17 5H9.5a3.5 3.5 0 0 0 0 7h5a3.5 3.5 0 0 1 0 7H6"/></svg>',
  '<svg viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2"/><line x1="8" y1="6" x2="16" y2="6"/><line x1="8" y1="10" x2="16" y2="10"/><line x1="8" y1="14" x2="12" y2="14"/><line x1="8" y1="18" x2="12" y2="18"/></svg>',
  '<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="4"/><line x1="12" y1="2" x2="12" y2="4"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="2" y1="12" x2="4" y2="12"/><line x1="20" y1="12" x2="22" y2="12"/></svg>',
  '<svg viewBox="0 0 24 24"><polyline points="17 1 21 5 17 9"/><path d="M3 11V9a4 4 0 0 1 4-4h14"/><polyline points="7 23 3 19 7 15"/><path d="M21 13v2a4 4 0 0 1-4 4H3"/></svg>',
  '<svg viewBox="0 0 24 24"><line x1="12" y1="20" x2="12" y2="10"/><line x1="18" y1="20" x2="18" y2="4"/><line x1="6" y1="20" x2="6" y2="16"/></svg>',
  '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M9 17V9"/><path d="M13 17V5"/><path d="M17 17v-3"/></svg>',
  '<svg viewBox="0 0 24 24"><rect x="1" y="6" width="14" height="11" rx="1"/><path d="M15 9h4l3 3v5h-7z"/><circle cx="6" cy="19" r="2"/><circle cx="17" cy="19" r="2"/><path d="M9 6V3l2-1 2 1v3"/></svg>',
  '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>',
  '<svg viewBox="0 0 24 24"><path d="M20 7L12 3L4 7M20 7L12 11M20 7V17L12 21M12 11L4 7M12 11V21M4 7V17L12 21"/></svg>',
  '<svg viewBox="0 0 24 24"><path d="M21 8a2 2 0 0 0-1-1.73l-7-4a2 2 0 0 0-2 0l-7 4A2 2 0 0 0 3 8v8a2 2 0 0 0 1 1.73l7 4a2 2 0 0 0 2 0l7-4a2 2 0 0 0 1-1.73z"/><path d="M9.5 9.5l5 5M14.5 9.5l-5 5"/></svg>',
  '<svg viewBox="0 0 24 24"><path d="M22 16.92v3a2 2 0 0 1-2.18 2 19.79 19.79 0 0 1-8.63-3.07 19.5 19.5 0 0 1-6-6 19.79 19.79 0 0 1-3.07-8.67A2 2 0 0 1 4.11 2h3a2 2 0 0 1 2 1.72c.127.96.361 1.903.7 2.81a2 2 0 0 1-.45 2.11L8.09 9.91a16 16 0 0 0 6 6l1.27-1.27a2 2 0 0 1 2.11-.45c.907.339 1.85.573 2.81.7A2 2 0 0 1 22 16.92z"/></svg>',
  '<svg viewBox="0 0 24 24"><polyline points="3 17 9 11 13 15 21 5"/><polyline points="14 5 21 5 21 12"/></svg>'
];

const arrow = '<svg viewBox="0 0 24 24"><line x1="5" y1="12" x2="19" y2="12"/><polyline points="12 5 19 12 12 19"/></svg>';

const grid = document.getElementById('grid');

// Build carousel (auto-scrolling strip of entries)
const carouselTrack = document.getElementById('carouselTrack');
const carouselHtml = APPS.map((app, i) => `
  <div class="carousel-item ${app.cls}" data-idx="${i}">
    <div class="carousel-icon">${icons[i]}</div>
    <span>${app.title}</span>
  </div>
`).join('');
carouselTrack.innerHTML = carouselHtml + carouselHtml;
carouselTrack.style.animationDuration = (APPS.length * 3) + 's';
carouselTrack.querySelectorAll('.carousel-item').forEach(el => {
  el.addEventListener('click', () => openApp(Number(el.dataset.idx)));
});

// Build cards
APPS.forEach((app, i) => {
  const card = document.createElement('div');
  card.className = 'card ' + app.cls;
  card.innerHTML = `
    <div class="card-icon-wrap">
      <div class="card-num">${app.num}</div>
      <div class="card-icon">${icons[i]}</div>
    </div>
    <div class="card-body">
      <div class="card-title">${app.title}</div>
      <div class="card-desc">${app.desc}</div>
    </div>
    <span class="card-cta">Akses Menu ${arrow}</span>
  `;
  card.addEventListener('click', () => openApp(i));
  grid.appendChild(card);
});

document.getElementById('yr').textContent = new Date().getFullYear();

// Sesuaikan: klik langsung mengubah tampilan menu (kisi <-> daftar)
const sesuaikanBtn = document.getElementById('sesuaikanBtn');
const sesuaikanIcon = document.getElementById('sesuaikanIcon');
let isListView = false;

const iconGrid = '<svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>';
const iconList = '<svg viewBox="0 0 24 24"><line x1="4" y1="6" x2="20" y2="6"/><line x1="4" y1="12" x2="20" y2="12"/><line x1="4" y1="18" x2="20" y2="18"/></svg>';

function renderSesuaikanIcon() {
  sesuaikanIcon.innerHTML = isListView ? iconList : iconGrid;
}
renderSesuaikanIcon();

sesuaikanBtn.addEventListener('click', () => {
  isListView = !isListView;
  grid.classList.toggle('list-view', isListView);
  sesuaikanBtn.classList.toggle('active', isListView);
  renderSesuaikanIcon();
});

const landing   = document.getElementById('landing');
const frameView = document.getElementById('frame-view');
const appFrame  = document.getElementById('app-frame');
const backBar   = document.getElementById('back-bar');
const mainHeader = document.querySelector('header');

function openApp(i) {
  appFrame.src = APPS[i].file;
  landing.classList.add('hidden');
  frameView.classList.add('active');
  backBar.classList.add('visible');
  mainHeader.classList.add('hidden');
  frameView.style.height = (window.innerHeight - backBar.offsetHeight) + 'px';
  window.scrollTo(0,0);
}

function goHome() {
  appFrame.src = 'about:blank';
  landing.classList.remove('hidden');
  frameView.classList.remove('active');
  backBar.classList.remove('visible');
  mainHeader.classList.remove('hidden');
  window.scrollTo(0,0);
}
